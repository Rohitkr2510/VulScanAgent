name: VulScanAgent Security Remediation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Run every Monday at 02:00 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  vulscan:
    name: Autonomous Vulnerability Scan & Auto-Fix
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Semgrep & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          pip install -r requirements.txt

      - name: Run VulScanAgent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: "auto"
        run: |
          python main.py scan --local . --severity HIGH
