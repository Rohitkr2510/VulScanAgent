name: Release VulScanAgent

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest
        run: pytest -v

  docker:
    name: Build & Publish Docker Image to GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    name: Create GitHub Release
    needs: [test, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: VulScanAgent ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🛡️ VulScanAgent Ready-to-Use Production Release

            ### 🚀 Quickstart Usage Options

            #### Option 1: Docker (No Installation Needed)
            ```bash
            docker run --rm -v $(pwd):/workspace \
              -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
              -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
              ghcr.io/${{ github.repository }}:latest scan --local /workspace
            ```

            #### Option 2: Python / PyPI
            ```bash
            pip install git+https://github.com/${{ github.repository }}.git
            vulscan scan --repo <your-repo-url>
            ```

            #### Option 3: GitHub Action
            ```yaml
            - uses: ${{ github.repository }}@v1
              with:
                gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
                github_token: ${{ secrets.GITHUB_TOKEN }}
            ```
