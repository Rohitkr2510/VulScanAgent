name: Sanitize Release Notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Overwrite Release v1.0.0 Body via API
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.github/RELEASE_NOTES.md', 'utf8');
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'v1.0.0'
              });
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                body: body
              });
              console.log('✅ Successfully sanitized and updated release v1.0.0 body!');
            } catch (err) {
              console.log('Note on release update:', err.message);
            }
